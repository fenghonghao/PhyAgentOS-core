# The gripper node (nodes/skill_server/src/gripper_stream.py).
joint_name: gripper
min_position: 0.0
max_position: 0.105

feedback_timeout_ms: 300  # stale joint state = driver fault (not a time limit on the task)
goal_tolerance: 0.001
stall_velocity_threshold: 0.0005
stall_timeout_ms: 250  # stopped this long = closed on something; at 20 mm/s the target is then 5 mm past the fingers
