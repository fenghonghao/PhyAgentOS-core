joint_name: gripper
coordinate_type: prismatic
min_position: 0.0
max_position: 0.105

control_period_ms: 20
feedback_timeout_ms: 300
goal_tolerance: 0.001
stall_velocity_threshold: 0.0005
stall_timeout_ms: 1500
allow_stalling: true  # closing on an object is the normal end of a grasp
goal_timeout_ms: 600000  # no time-based abort (scene rule)
terminal_history_size: 128
