# AgileX PIPER driver (robots_agilex_piper v1.1.3) (single arm in the booth).
# CAN interface: activate with piper_sdk can_activate.sh (name it after the USB port),
# then confirm with: robots_agilex_piper test can0   (gripper opens/closes)
port: can0
is_follower: true
debug: false
# hardware speed percent for normal actions; first real run 30, raise on site
motion_speed_percent: 30
# The driver moves here right after connecting and before Dora starts.
# The same pose as home_joints in skill_server.yaml, high above a box standing next to the arm.
# CHECK ON SITE that this pose is collision-free (camera pole, side panels).
positions:
  initial:
    joint2: 0.5
    joint3: -0.30
    gripper: 0.02
  # on stop the driver moves here and closes to this opening, then drops CAN (no disable)
  reset:
    joint5: 0.3
    gripper: 0.02
