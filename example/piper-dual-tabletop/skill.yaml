manifest_version: 2
name: piper-dual-tabletop
version: "0.1.0"
description: >-
  Single-arm AgileX PIPER tabletop manipulation (move target objects into containers, sort
  objects into groups, arrange blocks into an equation). The model writes Python blocks that
  call perception (segmentation + a vision-language model), motion and gripper primitives
  through one Action tool, robot.run; checks and retries that hold for any task run inside the
  primitives, task logic stays in the model's code.
skill_document: SKILL.md
gateway_url: http://127.0.0.1:19002
required_tools:
  - robot.run
profiles:
  real-piper:
    dataflow: profiles/real-piper/dataflow.yaml
    required_tools:
      - robot.run
    required_binaries:
      - gateway
      - motion_server
      - joint_trajectory_controller
      - gripper_action_controller
      - robots_agilex_piper
    required_assets:
      - assets/robots/piper/piper_with_gripper_real.urdf
    required_environment: []
    environment: {}
  sim-piper:
    dataflow: profiles/sim-piper/dataflow.yaml
    required_tools:
      - robot.run
    required_binaries:
      - gateway
      - motion_server
      - joint_trajectory_controller
      - gripper_action_controller
      - mujoco_sim
    required_assets:
      - assets/robots/piper/piper_with_gripper.urdf
      - assets/robots/piper/mjcf/scene.xml
      - assets/robots/piper/mjcf/PIPER.xml
    required_environment: []
    environment: {}
