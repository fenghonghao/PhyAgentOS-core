# Learned policies for run_policy(). Data layout (fps/arms/cameras) MUST match the collection
# config nodes/vla/collect/real-piper-dual.vla.yaml. Add trained models with nodes/vla/export_model.sh.
# Each entry: name, path (pretrained_model dir), sha256 (model.safetensors), description, task,
# optional n_action_steps (chunk length executed before re-planning), device, max_joint_step_rad.
fps: 30
torch_threads: 2     # HARDWARE-LIMITED (laptop CPU): 4-8 on the workstation
arms:
  left:
    urdf: ../../assets/robots/piper/piper_with_gripper.urdf
    home_joints:
    - 0.0
    - 0.5
    - -0.02
    - 0.0
    - 0.0
    - 0.0
    home_gripper_m: 0.07
    max_opening_m: 0.07
  right:
    urdf: ../../assets/robots/piper/piper_with_gripper.urdf
    home_joints:
    - 0.0
    - 0.5
    - -0.02
    - 0.0
    - 0.0
    - 0.0
    home_gripper_m: 0.07
    max_opening_m: 0.07
cameras:
- name: head
  input: head_color
  size:
  - 320
  - 240
- name: wrist_left
  input: wrist_left_color
  size:
  - 320
  - 240
- name: wrist_right
  input: wrist_right_color
  size:
  - 320
  - 240
policies: []
