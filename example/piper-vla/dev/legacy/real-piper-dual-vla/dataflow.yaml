      source: skill_server/left_gripper_goal
      queue_size: 1000
    gripper_cancel:
      source: skill_server/left_gripper_cancel
      queue_size: 1000
  outputs:
  - joint_command
  - gripper_feedback
  - gripper_result
- id: piper_left
  path: ${FORGE_RUNTIME_BIN}/robots_agilex_piper
  args: --config piper_left.yaml
  inputs:
    tick: dora/timer/millis/20
    action:
      source: cmd_mux/left_command
      queue_size: 10
  outputs:
