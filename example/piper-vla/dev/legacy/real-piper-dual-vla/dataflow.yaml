  - move_joints_result
  - move_pose_feedback
  - move_pose_result
  - trajectory_goal
  - trajectory_cancel
- id: jtc_right
  path: ${FORGE_RUNTIME_BIN}/joint_trajectory_controller
  args: --config controller.yaml
  inputs:
    tick: dora/timer/millis/20
    joint_state: piper_right/state
    trajectory_goal:
      source: motion_right/trajectory_goal
      queue_size: 1000
    trajectory_cancel:
      source: motion_right/trajectory_cancel
      queue_size: 1000
  outputs:
  - joint_command
  - trajectory_feedback
  - trajectory_result
- id: gripper_right
  path: ${FORGE_RUNTIME_BIN}/gripper_action_controller
  args: --config gripper_controller.yaml
  inputs:
    tick: dora/timer/millis/20
    joint_state: piper_right/state
    gripper_goal:
      source: skill_server/right_gripper_goal
      queue_size: 1000
    gripper_cancel:
      source: skill_server/right_gripper_cancel
      queue_size: 1000
  outputs:
  - joint_command
  - gripper_feedback
  - gripper_result
- id: piper_right
  path: ${FORGE_RUNTIME_BIN}/robots_agilex_piper
  args: --config piper_right.yaml
  inputs:
    tick: dora/timer/millis/20
