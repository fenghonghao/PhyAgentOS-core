# Learned policies for vla.run. Data layout (fps/arms/cameras) MUST match the collection
# config nodes/vla/collect/real-piper.vla.yaml. Add trained models with nodes/vla/export_model.sh.
# Each entry: name, path (pretrained_model dir), sha256 (model.safetensors), description, task,
# optional n_action_steps (chunk length executed before re-planning), device, max_joint_step_rad.
fps: 30
torch_threads: 2  # HARDWARE-LIMITED: CPU threads for the policy node (laptop); 4-8 on the workstation
home_joint_speed: 0.5   # rad/s along the vla.home path
arms:
  left:
    urdf: ../../assets/robots/piper/piper_with_gripper.urdf
    home_joints:
    - 0.0
    - 0.5
    - -0.02
    - 0.0
    - 0.0
    - 0.0
    home_gripper_m: 0.07
    max_opening_m: 0.07
cameras:
- name: head
  input: head_color
  size:
  - 320
  - 240
- name: wrist
  input: wrist_color
  size:
  - 320
  - 240
policies: []
