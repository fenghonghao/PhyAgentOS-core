manifest_version: 2
name: piper-vla
version: "0.1.0"
description: >-
  Learned visuomotor policies (ACT / pi0.5, LeRobot) on a single AgileX PIPER arm: teleop
  data collection, training and export, and on the robot four tools: list the trained policies,
  read the arm state, move to the start pose, and let a policy drive the arm for a chosen time.
skill_document: SKILL.md
gateway_url: http://127.0.0.1:19003
required_tools:
  - vla.policies
  - vla.state
  - vla.home
  - vla.run
profiles:
  real-piper:
    dataflow: profiles/real-piper/dataflow.yaml
    required_tools: [vla.policies, vla.state, vla.home, vla.run]
    required_binaries:
      - gateway
      - robots_agilex_piper
    required_assets:
      - assets/robots/piper/piper_with_gripper.urdf
    required_environment: []
    environment: {}
  sim-piper:
    dataflow: profiles/sim-piper/dataflow.yaml
    required_tools: [vla.policies, vla.state, vla.home, vla.run]
    required_binaries:
      - gateway
      - mujoco_sim
    required_assets:
      - assets/robots/piper/piper_with_gripper.urdf
      - assets/robots/piper/mjcf/scene.xml
      - assets/robots/piper/mjcf/PIPER.xml
    required_environment: []
    environment: {}
artifacts:
  resolver: registry
  nodes:
    gateway:
      artifact_id: gateway-1.0.2-linux-x86_64-tar-gz
      version: "1.0.2"
      platform: linux
      arch: x86_64
      artifact_type: executable_tar_gz
      entrypoint: gateway
      sha256: "07584846f16012c6137b10cf743073cd2fe9a7f64564ba2322a7090e66fd3076"
    mujoco_sim:
      artifact_id: mujoco_sim-1.1.1-linux-x86_64-tar-gz
      version: "1.1.1"
      platform: linux
      arch: x86_64
      artifact_type: executable_tar_gz
      entrypoint: mujoco_sim
      sha256: "4bb658e32aad1e4cb8c61d085e6dc5670611fb41760da6c705989f8fda19c826"
    robots_agilex_piper:
      artifact_id: agilex-piper-v1.1.3-linux-x86_64.tar.gz
      version: "1.1.3"
      platform: linux
      arch: x86_64
      artifact_type: executable_tar_gz
      entrypoint: robots_agilex_piper
      sha256: "a735edd80f3ca8550bde039324b338eb10ccab4ff41cb24e5919a29450f8ffe0"
